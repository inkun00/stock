name: KOSPI Morning Alpha Daily Automation

on:
  schedule:
    # 한국 시간(KST) 평일(월~금) 08:15 = UTC 23:15 (일~목)
    - cron: '15 23 * * 0-4'
  workflow_dispatch: # GitHub 웹에서 수동 실행 가능

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyze-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run KOSPI Alpha Engine Analysis
        run: |
          python run_daily_job.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ backend/cache/
          if git diff --staged --quiet; then
            echo "No changes in data"
          else
            git commit -m "chore(data): KOSPI 아침 08:15 최신 상승 확률 TOP 5 자동 갱신 [skip ci]"
            git push origin main
          fi
